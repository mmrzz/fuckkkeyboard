name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # lf-app (Tauri) links against WebKitGTK, GTK and the tray library.
      - name: Linux dependencies for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Speed gate
        run: cargo test --release -p lf-lang -- --ignored
      - name: Benchmark gate
        run: cargo run --release -p lf-train -- bench

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/lf-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/lf-app/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: UI tests
        run: npm test

  # On a version tag: build the Windows installers (.msi + NSIS .exe) and
  # attach them to a draft release.
  windows-installer:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, ui]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/lf-app/package-lock.json
      - name: Install UI dependencies
        working-directory: crates/lf-app
        run: npm ci
      - name: Build installers
        working-directory: crates/lf-app
        run: npm run tauri build -- --bundles msi,nsis
      - name: Checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem target/release/bundle/msi/*.msi, target/release/bundle/nsis/*.exe
          $files | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content -Encoding utf8 target/release/bundle/SHA256SUMS.txt
          Get-Content target/release/bundle/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/SHA256SUMS.txt
      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: packaging/RELEASE-NOTES.md
          files: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/SHA256SUMS.txt
